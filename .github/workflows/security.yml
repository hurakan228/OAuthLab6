
name: OAuthLab6 Security Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            semgrep/semgrep \
            semgrep scan \
              --config p/default \
              --metrics=off \
              --json \
              --output /src/reports/sast-pr.json \
              /src/app

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sast-semgrep-report
          path: reports/sast-pr.json
          if-no-files-found: warn

  sca:
    name: SCA - NPM Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --prefix app

      - name: Save SCA JSON report
        run: npm audit --prefix app --json > reports/sca-pr.json || true

      - name: Check for high or critical vulnerabilities
        run: npm audit --prefix app --audit-level=high

      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sca-npm-audit-report
          path: reports/sca-pr.json
          if-no-files-found: warn
